<!-- 

- HTML ( HyperText Markup Language ) : used to structure contents on the web page.
 -------------------------------------
- not a programming language. uses markups/tags to desccribe content.
- HyperText : a text can contain links to other pages/documents.


- HTML tag : is written using angle brackets.
  ----------

  <h1>Hello</h1>

  <h1>  - opening tag
  Hello - content
  </h1> - closing tag


- HTML element : consists of opening tag, content , closing tag.
  --------------
 
    <h1>Hello</h1> - the entire thing is known as element


- opening and closing tags : most elements will have opening and closing tag.
  --------------------------
- closing tag will have an / in tag.

 <p>This is a paragraph</p>


- void elements : some html elements do not have closing tags.
  ---------------

  Ex: <img>, <br>, <hr>, <input>, <meta>, <link>


- HTML attributes : provide extra information about the element.
  -----------------
- it controls or describes an element.

  <tag attribute="value" >

  Ex: <a href="https://google.com">Google</a> , <img src="photo.png" alt="dog picture" >


- global attributes : some attributes can be used on many different HTML elements.
  -------------------
- Ex: id, class, title, style, hidden, lang

   <div id="header"></div>
   <p class="text">Hello</p>
   <p title="this is additional information">Hello</p>
   <p style="color: red;">Hello</p>
   <p hidden>Hello</p>
   <html lang="en">


- HTML document structure :
  -------------------------

  <!DOCTYPE html>
  <html>
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>My Website</title>
    </head>
    <body>
      <h1>Hello World</h1>
      <p>Welcome to my website<p>
    </body>
  </html>


- <!DOCTYPE html> :
  -----------------
- DOCTYPE declaration, tells browser that this document should be interpreted using
  modern HTML standards.


- <html> :
  --------
- root element , everything in document is inside it.


- lang :
  ------
- lang attribute.
- a good document starts with <lang="en"> ( means primary language is english )
- Ex: Hindi (lang="hi") , French (lang="fr")


- <head> :
  --------
- contains metadata & resources about the document.
- its contents are not visible on page.
- contains <title>, <meta>, <link>, <style>, <script>


- <title> : 
  ---------
- defines document title.
- usually sees in browser tabs, bookmarks, search engine results.


- <meta charset="UTF-8"> :
  ------------------------
- specifies character encoding. supports a very large range of characters.


- Viewport Meta tag :
  ------------------
- important for responsive websites. Tells mobile browsers how to size and scale 
  the page's viewport.


- <body> :
  --------
- contains the content that make up the page.


- Headings (h1 to h6) :  html provides 6 headings.
-----------------------

- paragraph <p> : for paragraphs.
  ---------------

- line break <br> : creates a line break.
  -----------------

- horizontal line <hr> : represents thematic break between sections of content.
  ----------------------

- text formatting elements :
  --------------------------

- <strong> : indicates strong importance
- <br> : same like strong but not semantic.

- <em> : indicates emphasis.
- <italic> : represents text set apart from normal pose.

- <mark> : highlights text.
- <small> : represents side comments or small print.
- <del> : represents deleted content.
- <ins> : represents inserted content.
- <sub> : subscript (H₂O)
- <sup> : superscript (x²)


- HTML comments :
 ----------------
- browsers cant display comments as page content. users can inspect it.


- Nesting HTML elements :
  -----------------------
- elements can be placed inside another element.


- HTML entities :
  ---------------
- some characters have special meaning in HTML.

  &lt;   <
  &gt;   >
  &amp;  &
  &quot; "
  &apos; '
  &nbsp 


- <div> : generic block container.
  ------
- span: generic inline container.
  -----


- HTML case sensitivity :
  -----------------------
- html tags are case insensitive , but write them in lowercase.


- html file extension: .html
 ---------------------
