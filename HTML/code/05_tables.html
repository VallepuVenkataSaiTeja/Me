<!-- 

- Tables are used to represent tabular data — information arranged into rows and columns.

- <table> :
 ---------
- The <table> element is the main container for a table.
- The <table> itself doesn't represent a particular cell. It contains the table structure.

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>John</td>
            <td>25</td>
        </tr>

        <tr>
            <td>Sarah</td>
            <td>28</td>
        </tr>
    </table>

    ┌──────────┬─────┐
    │ Name     │ Age │
    ├──────────┼─────┤
    │ John     │ 25  │
    │ Sarah    │ 28  │
    └──────────┴─────┘


- <tr> :
 -------
- <tr> means: Table Row
- It creates one row.
- A table contains multiple <tr> elements.

        <tr>
            <td>John</td>
            <td>25</td>
        </tr>

        ┌──────────┬─────┐
        │ John     │ 25  │  ← one <tr>
        └──────────┴─────┘


- <th> :
 -------
- <th> means: Table Header Cell
- It represents a header cell.
- By default, browsers generally display <th> text bold and centered, 
  but don't depend on the default appearance. CSS controls presentation.

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        ┌──────────┬─────┬──────────┐
        │ Name     │ Age │ City     │  ← header
        ├──────────┼─────┼──────────┤
        │ John     │ 25  │ Delhi    │
        └──────────┴─────┴──────────┘


- <td> :
 -------
- <td> means: Table Data Cell
- It contains normal table data.

        <tr>
            <td>John</td>
            <td>25</td>
            <td>Delhi</td>
        </tr>

        ┌──────────┬─────┬──────────┐
        │ John     │ 25  │ Delhi    │
        └──────────┴─────┴──────────┘
        ↑           ↑       ↑
        <td>        <td>    <td>

    
- <thead> : <thead> groups the header rows of a table.
 ----------
- <tbody> : <tbody> groups the main body rows of the table.
 ----------
- <tfoot> : <tfoot> groups the footer rows of a table.
 ----------

        <table>

            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Laptop</td>
                    <td>$1000</td>
                </tr>

                <tr>
                    <td>Mouse</td>
                    <td>$50</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <th>Total</th>
                    <th>$1050</th>
                </tr>
            </tfoot>

        </table>


        ┌──────────────┬─────────┐
        │ Product      │ Price   │  ← THEAD
        ├──────────────┼─────────┤
        │ Laptop       │ $1000   │  ← TBODY
        │ Mouse        │ $50     │  ← TBODY
        ├──────────────┼─────────┤
        │ Total        │ $1050   │  ← TFOOT
        └──────────────┴─────────┘


- colspan : colspan allows a cell to span multiple columns.
 ----------

        <table border="1">

            <tr>
                <th colspan="2">Student Information</th>
            </tr>

            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>

            <tr>
                <td>John</td>
                <td>25</td>
            </tr>

        </table>

        ┌─────────────────────────────┐
        │     Student Information     │
        ├──────────────┬──────────────┤
        │ Name         │ Age          │
        ├──────────────┼──────────────┤
        │ John         │ 25           │
        └──────────────┴──────────────┘


- rowspan : rowspan allows a cell to span multiple rows.
 ----------

        <table border="1">

            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td rowspan="2">John</td>
                <td>HTML</td>
                <td>90</td>
            </tr>

            <tr>
                <td>CSS</td>
                <td>85</td>
            </tr>

        </table>

        ┌──────────┬──────────┬───────┐
        │ Name     │ Subject  │ Marks │
        ├──────────┼──────────┼───────┤
        │          │ HTML     │ 90    │
        │ John     ├──────────┼───────┤
        │          │ CSS      │ 85    │
        └──────────┴──────────┴───────┘

    
    | Attribute     | Meaning                 |
    | ------------- | ----------------------- |
    | `colspan="2"` | Cell occupies 2 columns |
    | `rowspan="2"` | Cell occupies 2 rows    |


- scope :
 -------
- scope tells the browser/assistive technologies what a header applies to.

        <th scope="col">Name</th>
        <th scope="col">Age</th>
        <th scope="col">City</th>
        - This header describes a column.

        <th scope="row">John</th>
        - Here John acts as the header for that row.


- <caption> :
 ------------
- It provides a title/description for the table.
- <caption> is useful for accessibility and makes the purpose of the table clear.

        <table>

            <caption>Student Exam Results</caption>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Marks</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>John</td>
                    <td>90</td>
                </tr>
            </tbody>

        </table>

        Student Exam Results
        ────────────────────
        Name       Marks
        John       90



-->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" style="border-collapse: collapse;" >
        <caption>this is table</caption>
        <thead>
            <tr>
                <th colspan="2">Name</th>
                <th>age</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Sai</td>
                <td>teja</td>
                <td>21</td>
            </tr>
            <tr>
                <td>Ram</td>
                <td>23</td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>
</body>
</html>
