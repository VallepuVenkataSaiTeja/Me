<!-- 

- background-color :
 -------------------
- background-color sets the background color of an element.

    .box {
        background-color: lightblue;
    }

- Transparent background :

    background-color: transparent;

- This means the element doesn't have its own background color.


- background-image :
 -------------------
- background-image places an image behind the content of an element.

    <section class="hero">
        <h1>Welcome</h1>
    </section>
    
    .hero {
        background-image: url("hero.jpg");
    }

- The image becomes the background of the section.


- background-size :
 ------------------
- This controls how the background image fits inside the element.
- The two most important values are:

    cover
    contain


- background-size: cover

- cover means: Make the image large enough to completely cover the element.
- The image may be cropped.
- If the image's aspect ratio doesn't match the container, some parts may be cut off.

Element:

┌──────────────────────────────┐
│                              │
│       BACKGROUND IMAGE       │
│                              │
└──────────────────────────────┘


- background-size: contain

- contain means: Scale the entire image so that it fits inside the element without cropping.
- The entire image remains visible.
- However, you may get empty space around the image.

┌──────────────────────────────┐
│                              │
│      ┌──────────────┐        │
│      │    IMAGE     │        │
│      └──────────────┘        │
│                              │
└──────────────────────────────┘

    cover   → cover the box
    contain → contain the image


- background-position :
 ----------------------
- background-position controls where the background image is positioned inside the element.
- Common values:

    center
    top
    bottom
    left
    right

- You can combine them: 

    background-position: center center; or
    background-position: center top;


- background-repeat :
 --------------------
- By default, background images can repeat if the image is smaller than the element.
- You can control this using background-repeat.

- no-repeat - The image appears only once. ( background-repeat: no-repeat; )
- repeat - Repeats horizontally and vertically. ( background-repeat: repeat; )
- repeat-x; - Repeats horizontally. ( background-repeat: repeat-x; )
- repeat-y; - Repeats vertically. ( background-repeat: repeat-y; )


- border :
 ---------
- The border property creates a line around an element.
- syntax - border: width style color;

    border: 3px solid red;
    
    3px   → width
    solid → style
    red   → color

- Border Styles :
 ----------------
- The most commonly used:

    solid
    dashed
    dotted


- Individual Borders :
 ---------------------
- You can style each side separately.

    .box {
        border-top: 2px solid red;
        border-right: 2px solid blue;
        border-bottom: 2px solid green;
        border-left: 2px solid black;
    }


- border-radius :
 ----------------
- border-radius makes the corners of an element rounded.

    .card {
        border-radius: 5px;
    }


- Different Border Radius for Each Corner :
 ------------------------------------------
- You can control individual corners:

    .box {
        border-top-left-radius: 20px;
        border-top-right-radius: 10px;
        border-bottom-right-radius: 30px;
        border-bottom-left-radius: 5px;
    }

- Or use shorthand:

    .box {
        border-radius: 20px 10px 30px 5px;
    }

- The order follows:

    top-left
    top-right
    bottom-right
    bottom-left


- box-shadow :
 -------------
- box-shadow adds a shadow around an element.
- Basic syntax -    box-shadow: x-offset y-offset blur color;

    box-shadow: 5px 5px 10px gray;
    
    5px  → horizontal position
    5px  → vertical position
    10px → blur
    gray → shadow color

- Negative Shadow Values : You can use negative values.

    box-shadow: -5px -5px 10px gray;

- Spread Radius : There is an optional fourth length:
 ----------------
- The spread controls how much the shadow expands.

    x-offset
    y-offset
    blur
    spread
    color

    .card {
        box-shadow: 0 4px 10px 2px gray;
    }

- inset :
 --------
- You can create an inner shadow using inset.

    box-shadow: inset 0 0 10px gray;


- Background Gradient :
 ----------------------
- Although your list says background-image, it's useful to know that CSS gradients are also commonly used as background images.

    .box {
        background-image: linear-gradient(to right, blue, purple);
    }


- Background Overlay : 
 ---------------------
- This is particularly useful for hero sections.
- You may want dark text/image overlay. You can combine a gradient with the image:
- The gradient appears over the image. This is frequently used to make white text readable over a photo.

    .hero {
        background-image:
            linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
            url("hero.jpg");
    
        background-size: cover;
        background-position: center;
    }


- background Shorthand :
 -----------------------

    .hero {
        background-image: url("hero.jpg");
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
    }
    
    .hero {
        background: url("hero.jpg") center / cover no-repeat;
    }

-->
