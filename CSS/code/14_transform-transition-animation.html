<!--

- Transform :
 ------------
→ Changes the visual position/size/rotation of an element

- Transition :
 -------------
→ Makes a CSS property change happen smoothly

- Animation :
 ------------
→ Creates a sequence of styles over time using @keyframes



- Transform :
 -------------
- transform changes how an element looks or is visually transformed without changing the normal document flow in the same way that 
  changing layout properties would.

    .element {
        transform: transform-function();
    }

- Common transform functions:

    translate()
    scale()
    rotate()
    skew()


- translate() :
 ---------------
- translate() moves an element visually.

    .box {
        transform: translate(50px, 20px);
    }

- Meaning:
    50px → move horizontally
    20px → move vertically
- You can think of it as: translate(X, Y)


- translateX() :
 ---------------
- Moves only horizontally.

    .box {
        transform: translateX(50px);
    }

- Positive value: → right
- Negative value: ← left


- translateY() :
 ----------------
- Moves only vertically.

    .box {
        transform: translateY(30px);
    }

- Positive: ↓ down
- Negative: ↑ up

 
- scale() :
 ----------
- scale() changes the visual size of an element.

    .box {
        transform: scale(1.2);
    }

- This makes the element approximately: 20% larger

- transform: scale(1);   Normal size.
- transform: scale(1.5); Larger.
- transform: scale(0.5); Smaller.


- scaleX() and scaleY() :
 ------------------------
- You can scale horizontally or vertically.

    .box {
        transform: scaleX(1.5);
    }

- Makes it wider.

    .box {
        transform: scaleY(1.5);
    }

- Makes it taller.

- You can also use: transform: scale(1.2, 1.5);
- Meaning:
    X → 1.2
    Y → 1.5


- rotate() :
 ------------ 
- Rotates an element.

    .box {
        transform: rotate(45deg);
    }

- Positive angle: rotates clockwise.
- Negative angle: rotates in the opposite direction.


- skew() :
 ---------- 
- skew() tilts/distorts an element.

    .box {
        transform: skew(20deg);
    }

- You can also use: 
    transform: skewX(20deg);
    or:
    transform: skewY(20deg);


- Multiple Transforms :
 ----------------------
- You can apply multiple transformations together.
- The order of transform functions can matter.

    .box {
        transform: translateX(50px) rotate(20deg) scale(1.2);
    }


- Transform Origin :
 -------------------
- By default, many transformations happen around the element's center.
- You can change that using: transform-origin

    .box {
        transform-origin: left center;
        transform: rotate(45deg);
    }

- Now the rotation happens around the left-center point.
- Common values:

    transform-origin: center;
    transform-origin: top left;
    transform-origin: bottom right;


- Transition :
 --------------
- A CSS transition makes a property change happen smoothly over a period of time.

    .element {
        transition: property duration;
    }

    button {
        transition: background-color 0.3s;
    }


- Transition Duration :
 ----------------------

    button {
        transition: background-color 0.5s;
    }

- 0.5s means: half a second


- Transition Multiple Properties :
 ----------------------------------
- You can transition multiple properties:

    button {
        transition: background-color 0.3s, transform 0.3s;
    }


- transition-duration :  ( transition-duration: 0.3s; )
 -----------------------
Specifies how long the transition takes.

- transition-delay : ( transition-delay: 0.2s; )
 --------------------
- Delays the transition before it begins.

- transition-timing-function :
 ------------------------------
- Controls the speed pattern of the transition.
- Common values:

    linear
    ease
    ease-in
    ease-out
    ease-in-out

- linear - Constant speed. ( transition: transform 0.5s linear; )
- ease - Starts and ends more gently. ( transition: transform 0.5s ease; )
- ease-in - Starts slowly. ( transition: transform 0.5s ease-in; )
- ease-out - Ends slowly. ( transition: transform 0.5s ease-out; )
- ease-in-out - Starts and ends slowly. ( transition: transform 0.5s ease-in-out; )


- Transition Shorthand :
 ------------------------
- Instead of writing:

    button {
        transition-property: transform;
        transition-duration: 0.3s;
        transition-timing-function: ease;
        transition-delay: 0s;
    }

- you can write:

    button {
        transition: transform 0.3s ease;
    }


- Transform + Transition Together :
 -----------------------------------
- This is one of the most common CSS patterns.

    .card {
        transition: transform 0.3s ease;
    }
    
    .card:hover {
        transform: translateY(-10px);
    }


- Animation :
 ------------
- A CSS animation is different from a transition.
- A transition generally happens when a property changes because of some trigger such as:
    :hover
    :focus
    class change
- An animation can run through a defined sequence of styles using: @keyframes

    @keyframes moveBox {
        from {
            transform: translateX(0);
        }
        to {
            transform: translateX(200px);
        }
    }

- Then apply it:

    .box {
        animation: moveBox 2s;
    }

- @keyframes :
 -------------
- @keyframes defines the stages of an animation.

    @keyframes animation-name {
        from {
            /* starting styles */
        }
    
        to {
            /* ending styles */
        }
    }

    @keyframes moveRight {
        from {
            transform: translateX(0);
        }
    
        to {
            transform: translateX(200px);
        }
    }

- Animation Using Percentages :  This allows more complex animations.

    @keyframes boxAnimation {
        0% {
            transform: translateX(0);
        }
    
        50% {
            transform: translateX(200px);
        }
    
        100% {
            transform: translateX(0);
        }
    }

- This means:
    0%   → starting position
    50%  → move right
    100% → return


- Animation Duration :
 ----------------------

    .box {
        animation-duration: 2s;
    }

Or shorthand:

    .box {
        animation: moveRight 2s;
    }

- The animation takes two seconds to complete one iteration.


- animation-iteration-count :
 ----------------------------
- Controls how many times the animation runs.

  One time:    animation-iteration-count: 1;
  Three times: animation-iteration-count: 3;
  Forever:     animation-iteration-count: infinite;


- animation-direction :
 ----------------------
- Controls the direction of animation.
- Common values:
    normal
    reverse
    alternate
    alternate-reverse

    .box {
        animation: move 2s infinite alternate;
    }

- Instead of: start → end → start → end
- it can move: start → end → end → start → start → end
- The alternate pattern is useful for bouncing/moving effects.


- animation-delay :
 -------------------
- Delays the animation.

    .box {
        animation: move 2s;
        animation-delay: 1s;
    }

- The browser waits one second before starting the animation.


- animation-timing-function :
 -----------------------------
- Same basic concept as transitions.

    animation-timing-function: linear;
    or:
    animation-timing-function: ease;
    or:
    animation-timing-function: ease-in-out;


- animation-fill-mode :
 ----------------------
- This controls styles before/after the animation.
- Common values:
    none
    forwards
    backwards
    both

- The most useful beginner value is: animation-fill-mode: forwards;
- It means the element can retain the styles from the final keyframe after the animation finishes.


- animation Shorthand :
 ----------------------
- Instead of:

    .box {
        animation-name: move;
        animation-duration: 2s;
        animation-timing-function: ease;
        animation-delay: 0s;
        animation-iteration-count: infinite;
        animation-direction: alternate;
    }

- you can write:

    .box {
        animation: move 2s ease 0s infinite alternate;
    }


- prefers-reduced-motion : lets websites adapt animations for users who prefer less motion.
 -------------------------


-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            background-color: rebeccapurple;
            transform: translateX(20px);
            /* transform: translateY(100px); */
            /* transform: scale(2); */
            /* transform: rotate(45deg); */
            /* transform: skew(20deg); */
        }
        button {
            background-color: yellow;
            padding: 10px 20px;
            transition: background-color 0.5s;
            transition-timing-function: ease-in-out;
        }
        button:hover {
            background-color: aqua;
            animation: moveRight 1s ease-in-out 1s infinite alternate;
            /* animation-iteration-count: infinite; */
        }
        @keyframes moveRight{
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(100px);
            }
        }
    </style>
</head>
<body>
    <div>
        <p>paragraph</p>
        <button>Click</button>
    </div>
</body>
</html>
