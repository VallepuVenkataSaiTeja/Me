<!-- 
 
- Object :
 ----------
- An object is a collection of data stored in key-value pairs.

    const student = {
        name: "Sai",
        age: 22,
        course: "React",
        city: "Kadapa"
    };

- Here:

    name   → "Sai"
    age    → 22
    course → "React"
    city   → "Kadapa"

- Each pair is called a property.


- Creating an Object :
 ----------------------
- The most common way is using an object literal.

    const person = {
        name: "Rahul",
        age: 25,
        city: "Hyderabad"
    };

- You can also create an empty object:

    const person = {};

* Then add properties later:

    person.name = "Rahul";
    person.age = 25;


- Object Properties :
 ---------------------

    const student = {
        name: "Sai",
        age: 22,
        course: "React"
    };

- Here:

    name   → property
    age    → property
    course → property

- And their values are:

    "Sai"   → value
    22      → value
    "React" → value

- A property can contain different data types.

    const student = {
        name: "Sai",           // string
        age: 22,               // number
        passed: true,          // boolean
        skills: ["HTML", "CSS", "JS"], // array
        address: {
            city: "Kadapa"
        }                      // object
    };


- Accessing Object Properties :
 --------------------------------
- There are two main ways.

* Method 1: Dot notation :

    console.log(student.name);
    console.log(student.age);

* Bracket Notation :

    console.log(student["name"]);
    console.log(student["age"]);

- Usually use dot notation when you know the property name.
- Use bracket notation when the property name is stored in a variable.

    const student = {
        name: "Sai",
        age: 22
    };
    const property = "name";
    console.log(student[property]);


- Adding Properties :
 ---------------------
- You can add a property after creating an object.

    const student = {
        name: "Sai"
    };
    student.age = 22;
    console.log(student);

- You can also use bracket notation:

    student["city"] = "Kadapa";


- Updating Properties :
 -----------------------

    const student = {
        name: "Sai",
        age: 22
    };

    student.age = 23;
    student["age"] = 24;


- Deleting Properties :
 ----------------------
- Use the delete operator.
- delete object.property; removes the property.

    const student = {
        name: "Sai",
        age: 22,
        city: "Kadapa"
    };
    delete student.city;


- Checking if a Property Exists :
 --------------------------------
- You can use: "name" in student

const student = {
    name: "Sai",
    age: 22
};
console.log("name" in student); // true
console.log("city" in student); // false


- hasOwnProperty() :
 -------------------
- Another common way:

console.log(student.hasOwnProperty("name")); // true
console.log(student.hasOwnProperty("city")); // false

- Modern JavaScript also provides:

    Object.hasOwn(student, "name");


- Nested Objects :
 ------------------
- An object can contain another object.

    const student = {
        name: "Sai",
        age: 22,
        address: {
            city: "Kadapa",
            state: "Andhra Pradesh",
            pincode: 516001
        }
    };
    console.log(student.address.city); // kadapa
    console.log(student.address.pincode); // 516001


- Optional Chaining ?. 
 ----------------------

    const student = {
        name: "Sai"
    };
    console.log(student.address.city);

- you get an error because address doesn't exist.
- Instead: 

    console.log(student.address?.city); // undefined


- Object Methods :
 -----------------
- An object can contain functions.
- A function stored inside an object is commonly called a method.

    const person = {
        name: "Sai",
        greet: function() {
            console.log("Hello");
        }
    };

- Call the method: person.greet();

* Short Method Syntax :

    const person = {
        greet() {
            console.log("Hello");
        }
    };


- Object Method Using this :
 ---------------------------

const person = {
    name: "Sai",
    greet() {
        console.log("Hello " + this.name); // Hello Sai
    }
};
person.greet();


- Object Property Shorthand :
 ----------------------------

- Suppose:

    const name = "Sai";
    const age = 22;

- Instead of:

    const student = {
        name: name,
        age: age
    };

- Modern JavaScript allows:

    const student = {
        name,
        age
    };

- JavaScript understands automatically.

    name: name
    age: age


- Example :

    const name = "Sai";
    const course = "React";
    const student = {
        name,
        course
    };
    console.log(student);

- Output:

    {
        name: "Sai",
        course: "React"
    }


- Computed Property Names :
 ---------------------------
- You can create a property name dynamically.

    const key = "name";
    const student = {
        [key]: "Sai"
    };
    console.log(student);

- Output:

    {
        name: "Sai"
    }


- Object Destructuring :
 -----------------------

    const student = {
        name: "Sai",
        age: 22,
        course: "React"
    };

- Normally:

    console.log(student.name);
    console.log(student.age);

- With destructuring:

    const { name, age } = student;
    console.log(name);
    console.log(age);


* Destructuring With Different Variable Name : 

    const { name: studentName } = student;
    console.log(studentName); // Sai


* Default Values in Destructuring : 

    const student = {
        name: "Sai"
    };
    const { name, age = 22 } = student;
    console.log(name);
    console.log(age);


* Nested Destructuring :

    const student = {
        name: "Sai",
        address: {
            city: "Kadapa",
            state: "Andhra Pradesh"
        }
    };

    const { address: { city, state } } = student;
    console.log(city);
    console.log(state);


- Object Spread Operator :
 --------------------------

    const student = {
        name: "Sai",
        age: 22
    };

- Create a copy:

    const newStudent = {
        ...student
    };
    console.log(newStudent);

- Output:

    {
        name: "Sai",
        age: 22
    }


* Adding Properties With Spread :

    const student = {
        name: "Sai",
        age: 22
    };

    const newStudent = {
        ...student,
        course: "React"
    };

-  Result:

    {
        name: "Sai",
        age: 22,
        course: "React"
    }


* Updating an Object With Spread : 

    const student = {
        name: "Sai",
        age: 22
    };

- You want a new object with age 23.

    const updatedStudent = {
        ...student,
        age: 23
    };


* Property Order Matters With Spread :

- When object properties have the same key, the later value overwrites the earlier value.

    const student = {
        age: 22
    };
    const result = {
        age: 23,
        ...student
    };
    console.log(result.age); // 22


- Object.keys() :
 -----------------
- Returns an array containing the object's keys.

    const student = {
        name: "Sai",
        age: 22,
        city: "Kadapa"
    };
    console.log(Object.keys(student)); // ["name", "age", "city"]


- Object.values() :
 -------------------
- Returns the values.

    console.log(Object.values(student)); // ["Sai", 22, "Kadapa"]


- Object.entries() :
 --------------------
- Returns key-value pairs.

    console.log(Object.entries(student));

    [
        ["name", "Sai"],
        ["age", 22],
        ["city", "Kadapa"]
    ]


- Looping Through Object Properties :
 -------------------------------------

 * Using Object.keys():

    Object.keys(student).forEach(key => {
        console.log(key);
    });

    name
    age
    city


* Using Object.entries():

    Object.entries(student).forEach(([key, value]) => {
        console.log(key, value);
    });

    name Sai
    age 22
    city Kadapa


- Object Reference :
 -------------------

    const student1 = {
        name: "Sai"
    };
    const student2 = student1;
    student2.name = "Rahul";
    console.log(student1.name); // Rahul

- student2 = student1; doesn't create a new independent object.
- Both variables refer to the same object.

    student1 ──┐
            ↓
            { name: "Rahul" }
            ↑
    student2 ──┘

- Objects Are Reference Values

- Copying an Object With Spread :
 ---------------------------------

    const student1 = {
        name: "Sai",
        age: 22
    };

    const student2 = {
        ...student1
    };

    student2.name = "Rahul";

    console.log(student1.name); // Sai
    console.log(student2.name); // Rahul

 - But Spread Creates a Shallow Copy

    const student1 = {
        name: "Sai",
        address: {
            city: "Kadapa"
        }
    };

    const student2 = {
        ...student1
    };

- The outer object is copied.
- But: address is still referencing the same nested object.
- So:

    student2.address.city = "Hyderabad";
    console.log(student1.address.city); // Hyderabad

- Because the nested object was not deeply copied.


- Shallow Copy vs Deep Copy :
 -----------------------------

- Shallow copy :
 ---------------
- Copies only the first level.

- Deep copy :
 -------------
- Creates independent nested structures.
- const copy = structuredClone(original);

    const student1 = {
        name: "Sai",
        address: {
            city: "Kadapa"
        }
    };
    const student2 = structuredClone(student1);
    student2.address.city = "Hyderabad";
    console.log(student1.address.city); // Kadapa


- Comparing Objects :
 --------------------

    const obj1 = {
        name: "Sai"
    };
    const obj2 = {
        name: "Sai"
    };
    console.log(obj1 === obj2); // false

- Because they are two different object references.
- Objects are compared by reference, not by their contents.

    const obj1 = {
        name: "Sai"
    };
    const obj2 = obj1;
    console.log(obj1 === obj2); // true


- Object With Function :
 -----------------------
- Objects can contain data and behavior.

    const calculator = {
        add(a, b) {
            return a + b;
        },

        subtract(a, b) {
            return a - b;
        }
    };

    console.log(calculator.add(10, 5)); // 15
    console.log(calculator.subtract(10, 5)); // 5
