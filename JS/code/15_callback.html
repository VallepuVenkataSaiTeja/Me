- Callback :
 -----------
- A callback is a function passed as an argument to another function, 
  which is then called later by that function.
- simple words : Function passed into another function = Callback

    function greet() {
        console.log("Hello");
    }
    function executeFunction(callback) {
        callback();
    }
    executeFunction(greet); // hello


- Why Are Callbacks Possible?
 ----------------------------
 - Because in JavaScript, functions are first-class values.
- That means a function can be:
    * stored in a variable
    * passed as an argument
    * returned from another function
    * stored inside an object or array


- Callback Syntax :
 -------------------

    function mainFunction(callback) {
        callback();
    }

    function myCallback() {
        console.log("Callback executed");
    }

    mainFunction(myCallback);


- Callback Using an Arrow Function :
 ------------------------------------
- You don't always have to create a separate function.
- You can directly pass an arrow function.

    function execute(callback) {
        callback();
    }

    execute(() => {
        console.log("Hello"); // Hello
    });


- Callback with Parameters :
 ----------------------------
- A callback can receive values.

    function calculate(a, b, callback) {
        const result = a + b;
        callback(result);
    }

    function display(result) {
        console.log(result);
    }

    calculate(10, 20, display); // 30


- Callback with an Arrow Function :
 -----------------------------------
- The same example can be written more simply:

    function calculate(a, b, callback) {
        const result = a + b;
        callback(result);
    }

    calculate(10, 20, (result) => {
        console.log(result);          // 30
    });


- Very Important: function vs function() :
 ------------------------------------------

- Passing function :                execute(greet);
- Executing function immediately :  execute(greet());

function greet() {
    console.log("Hello");
    return 100;
}

function execute(callback) {
    console.log(callback);
}

execute(greet); // [Function: greet]
execute(greet()); // Hello  
                     10


- Synchronous Callbacks :
 -------------------------
- A callback doesn't automatically mean asynchronous.
- Callbacks can be synchronous or asynchronous.

    function process(callback) {
        console.log("Start");
        callback();
        console.log("End");
    }

    process(() => {
        console.log("Callback");
    });

- Output:

    Start
    Callback
    End

- The callback executes immediately before process() finishes.
- This is a synchronous callback.


- Array Methods Use Callbacks :
 -------------------------------

 * Callback with forEach() :
  ---------------------------

    const numbers = [10, 20, 30];
    numbers.forEach(function(number) {
        console.log(number);
    });

- Here: this is the callback.

    function(number) {
        console.log(number);
    }

- You can write:

    numbers.forEach((number) => {
        console.log(number);
    });

* map() Uses a Callback :
 -------------------------

    const numbers = [1, 2, 3, 4];
    const result = numbers.map((number) => {
        return number * 2;
    });
    console.log(result);

- The callback:

    (number) => {
        return number * 2;
    }

* filter() Uses a Callback :
 ----------------------------

    const numbers = [10, 15, 20, 25];
    const result = numbers.filter((number) => {
        return number > 15;
    });
    console.log(result);

* find() Uses a Callback :
 --------------------------

    const numbers = [10, 20, 30, 40];
    const result = numbers.find((number) => {
        return number > 20;
    });
    console.log(result);

* some() Uses a Callback :
 --------------------------

    const numbers = [1, 3, 5, 8];
    const result = numbers.some((number) => {
        return number % 2 === 0;
    });
    console.log(result);

* every() Uses a Callback :
 ---------------------------

    const numbers = [2, 4, 6, 8];
    const result = numbers.every((number) => {
        return number % 2 === 0;
    });
    console.log(result);

* reduce() Uses a Callback :
 ----------------------------
 
    const numbers = [10, 20, 30];
    const total = numbers.reduce((sum, number) => {
        return sum + number;
    }, 0);
    console.log(total);


- Callback Parameters in Array Methods :
 ----------------------------------------
- Callbacks can receive more than one parameter.

    const fruits = ["Apple", "Banana", "Mango"];
    fruits.forEach((fruit, index, array) => {
        console.log(fruit);
        console.log(index);
    });

The callback can receive: (element, index, array)


- Callback with setTimeout() :
 ------------------------------
- Now callbacks become especially important for asynchronous JavaScript.

    console.log("Start");
    setTimeout(() => {
        console.log("Hello");
    }, 2000);
    console.log("End");


- Callback with Events :
 ------------------------
- Browser events also use callbacks.

    button.addEventListener("click", function() {
        console.log("Button clicked");
    });

- The function: is a callback.

    function() {
        console.log("Button clicked");
    }


- React Uses Callbacks Everywhere :
 ----------------------------------

    function App() {

        function handleClick() {
            console.log("Button clicked");
        }

        return (
            <button onClick={handleClick}>
                Click Me
            </button>
        );
    }

- Here: onClick={handleClick} passes the function as a callback/event handler.

- handleClick means Give React the function.
- handleClick() means Execute the function now.


- Passing Arguments in React :
 -----------------------------

    function handleClick(name) {
        console.log(name);
    }

- You cannot normally do:

    <button onClick={handleClick("Sai")}>
        Click
    </button>

- Instead:

    <button onClick={() => handleClick("Sai")}>
        Click
    </button>

- () => handleClick("Sai") is the callback.


- Callback Hell :
 ----------------
- When callbacks are deeply nested, code can become difficult to read.
- This shape is often called: Callback Hell or Pyramid of Doom
- The problem is too many nested callbacks, especially for asynchronous operations.
- Promises and async/await were introduced to make these flows easier to manage.

    Get User
    ↓
    Get Orders
    ↓
    Get Payment
    ↓
    Send Email
    ↓
    Finish

- With deeply nested callbacks:

    getUser(function(user) {
        getOrders(user, function(orders) {
            getPayment(orders, function(payment) {
                sendEmail(payment, function() {
                    console.log("Done");
                });
            });
        });
    });


- Callback vs Function :
 ------------------------
- A callback is not a special type of function.
- A callback is simply a function that is passed to another function to be called by it.


- Callback vs Higher-Order Function :
 -------------------------------------
- These two concepts are related.

    numbers.map(callback);

- A function passed to another function. Here callback is the callback.

    function execute(callback) {
        callback();
    }

- execute() is a higher-order function because it accepts a function.

    Callback
        ↓
    Function passed to another function

    Higher-Order Function
        ↓
    Function that accepts/returns another function


- Callback Return Values :
 --------------------------
- A callback can return a value.

    function calculate(a, b, callback) {
        const result = callback(a, b);
        console.log(result);
    }

    calculate(10, 5, (a, b) => {
        return a + b;
    });


- A Callback Can Be Reused :
 ----------------------------

    function double(number) {
        return number * 2;
    }

    function triple(number) {
        return number * 3;
    }

    function process(number, callback) {
        return callback(number);
    }

    console.log(process(5, double));
    console.log(process(5, triple));
