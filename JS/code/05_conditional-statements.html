<!-- 

- Conditional Statements :
 -------------------------
- Conditional statements are used when your program needs to make decisions.
- If this condition is true, do this. Otherwise, do something else.


- Condition :
 ------------
- A condition is an expression that results in: true or false.
- JavaScript uses these true/false results to make decisions.


- if Statement :
 ---------------

    if (condition) {
        // code
    }

    let age = 20;
    if (age >= 18) {
        console.log("You are an adult"); // You are an adult
    } 

- if the Condition is False? Nothing is printed.


- if...else :
 ------------
- When you want to do one thing if the condition is true and another thing if it's false:

    if (condition) {
        // true
    } else {
        // false
    }

    let age = 15;
    if (age >= 18) {
        console.log("You can vote");
    } else {
        console.log("You cannot vote"); // You cannot vote
    }


- else if :
 -----------
- What if you have multiple conditions?

    if (condition1) {

    } else if (condition2) {

    } else if (condition3) {

    } else {

    }

    let marks = 75;
    if (marks >= 90) {
        console.log("Grade A");
    } else if (marks >= 75) {
        console.log("Grade B"); // Grade B
    } else if (marks >= 50) {
        console.log("Grade C");
    } else {
        console.log("Fail");
    }


- Conditions Don't Have to Be Comparisons :
- You can directly use a variable: 

    let isLoggedIn = true;
    if (isLoggedIn) {
        console.log("Welcome");
    }

- Because: isLoggedIn is already true.


- Nested if :
 -------------
- An if statement can exist inside another if.

    let age = 25;
    let hasLicense = true;
    if (age >= 18) {
        if (hasLicense) {
            console.log("You can drive");
        }
    }


- Nested if with else :
 -----------------------

    let age = 20;
    let hasLicense = false;
    if (age >= 18) {
        if (hasLicense) {
            console.log("You can drive");
        } else {
            console.log("You need a license");
        }
    } else {
        console.log("You are underage");
    }


- switch Statement :
 -------------------
- switch is useful when you're comparing one value against multiple possible values.

    switch (value) {
        case value1:
            // code
            break;

        case value2:
            // code
            break;

        default:
            // code
    }


    let day = 2;
    switch (day) {
        case 1:
            console.log("Monday");
            break;

        case 2:
            console.log("Tuesday");
            break;

        case 3:
            console.log("Wednesday");
            break;

        default:
            console.log("Invalid day");
    }


- Why break Is Important : Because without break, JavaScript continues into the following cases.
- Normally you use: break to stop execution after a matching case.


- default :
 ----------
- default executes when no case matches.


- Ternary Operator :
 -------------------
- The ternary operator is a short form of if...else.

    condition ? valueIfTrue : valueIfFalse

    let age = 20;
    let result = age >= 18 ? "Adult" : "Minor";
    console.log(result); // adult


- Early Return :
 ----------------
- This is a very useful pattern in JavaScript and React.

- Instead of:

    function getUserName(user) {
        if (user) {
            return user.name;
        } else {
            return "Guest";
        }
    }

- you can write:

    function getUserName(user) {
        if (!user) {
            return "Guest";
        }
        return user.name;
    }

- This is called an early return. It reduces nesting.

-->
