- JavaScript :
 -------------
- JavaScript is a programming language used to make web pages interactive and dynamic.

- HTML gives the webpage its structure.
- CSS gives it style.
- JavaScript gives it behavior.


- Why do we need JavaScript? 
 ---------------------------
- Without JavaScript, most websites would be mostly static.

- 1. Change webpage content
- 2. Handle user actions
- 3. Validate forms
- 4. Communicate with APIs
- 5. Create interactive applications


- Is JavaScript only for browsers? 
  ---------------------------------
- JavaScript was originally designed primarily for browsers, but today it can run in many environments.
- With Node.js, JavaScript can run on the server.
- So JavaScript can be used for both frontend and backend development.


- How JavaScript runs ?
 ----------------------
- The browser has a JavaScript engine that reads and executes JavaScript.
- Different browsers use different JavaScript engines.
        Chrome / Edge → V8
        Firefox       → SpiderMonkey
        Safari        → JavaScriptCore


- Where can you write JavaScript? 
 ---------------------------------
- Inline JavaScript : JavaScript is written directly inside an HTML element.
- Internal JavaScript : JavaScript can be written inside a <script> tag.
- External JavaScript : This is the preferred approach for normal projects.


- console.log() :
 ----------------
- It prints information to the browser's developer console.

        let name = "Sai";
        console.log(name);


- JavaScript Comments :
 ----------------------
- Comments are text that JavaScript does not execute.
- They are useful for explaining code.

- Single-line comment :
 -----------------------

        // This is a comment
        console.log("Hello");

- Multi-line comment :
 ---------------------

        /*
            This is a
            multi-line comment
        */
        console.log("Hello");


- JavaScript Statements :
 -------------------------
- A statement is an instruction given to JavaScript.

    let name = "Sai";   That's an instruction.


- Semicolon :
 -------------
- JavaScript statements can usually end with a semicolon.
- because JavaScript has something called Automatic Semicolon Insertion (ASI).


- JavaScript is Case-Sensitive :
 --------------------------------
- These are different:

        let name = "Sai";
        let Name = "John";


- JavaScript Identifiers :
 -------------------------
- An identifier is the name you give to something in JavaScript.

        let name = "Sai";   Here: name is an identifier.

- Identifiers can represent: Variables, Functions, Classes, Objects, etc.


- JavaScript Naming Rules :
 --------------------------

- Valid
        let name;
        let age;
        let studentName;
        let _name;
        let $price;

- invalid
        - Cannot start with a number ( let 123name; )
        - Spaces aren't allowed ( let student name; )
        - Reserved words cannot normally be used ( let class; )

- Naming convention: camelCase ( let studentName; )


- JavaScript is dynamically typed :
 -----------------------------------
- In JavaScript, you don't have to explicitly declare the data type of a variable.

        let value = 10;
        console.log(value);
        value = "Hello";
        console.log(value);


- JavaScript is interpreted or compiled ?
 -----------------------------------------
- JavaScript is a high-level programming language whose execution is handled by a 
  JavaScript engine, and modern engines use both interpretation and JIT compilation techniques.
- Modern JavaScript engines use techniques such as:

        Parsing
        Compilation
        Just-in-time (JIT) compilation
        Optimization


- JavaScript is single-threaded :
 --------------------------------
- JavaScript's main execution model uses a single call stack, meaning it executes one 
  piece of JavaScript code at a time on that stack.
